name: Weekly Validation

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  slow-e2e:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg=7:6.1.1-3ubuntu5

      - name: Show media-tool versions
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Sync locked Python dependencies
        run: |
          uv sync --locked --extra test --extra detectorlab

      - name: Show Python detector-lab dependency versions
        run: |
          .venv/bin/python --version
          .venv/bin/python - <<'PY'
          import cv2
          import numpy

          print(f"numpy=={numpy.__version__}")
          print(f"opencv-python-headless=={cv2.__version__}")
          PY

      # `weekly_slow_real_media` lanes still resolve through the same shared
      # manifest contract as the protected PR lanes, but they own the slow and
      # real-media boundary on purpose. Manifest validation enforces that the
      # shared weekly groups stay here instead of drifting into
      # `contract_boundary` or `fast_synthetic`. That keeps the
      # `contract_boundary` lane fast enough for PR work while preserving
      # deeper weekly confidence. The same shared lane model lives in
      # `ci_target_manifest.py`, backed by `.github/ci_test_targets.json`.
      # Weekly lanes share the same manifest validator, including the explicit
      # path-existence inventory/scope contract that the dedicated
      # `check_ci_test_paths_exist.py` guard consumes for inline and
      # policy-owned test expectations. Unlike the protected PR lanes, weekly
      # lanes stop at manifest validation and do not run the existence/drift
      # guard sequence before their heavier suites.
      - name: Validate manifest-backed CI target groups
        run: .venv/bin/python .github/scripts/validate_ci_test_targets.py

      - name: Preflight checked-in weekly media and tools
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          .venv/bin/python .github/scripts/check_weekly_media_preflight.py 2>&1 | tee ci-artifacts/weekly-media-preflight.log

      - name: Run weekly_slow_real_media slow e2e media tests
        env:
          ESM_DETECTOR_LAB_ARTIFACT_DIR: ci-artifacts/detector-lab-real-media
          ESM_GROUND_TRUTH_ARTIFACT_DIR: ci-artifacts/ground-truth-failures
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          set +e
          PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/pytest -p no:cacheprovider -m "slow" \
            $(.venv/bin/python .github/scripts/read_ci_test_targets.py weekly_slow_media --separator space) \
            -q --junitxml=ci-artifacts/weekly-media-results.junit.xml 2>&1 | tee ci-artifacts/slow-e2e.log
          pytest_status=${PIPESTATUS[0]}
          set -e
          .venv/bin/python .github/scripts/build_weekly_media_result_index.py \
            --junitxml ci-artifacts/weekly-media-results.junit.xml \
            --output ci-artifacts/weekly-media-results.json
          cat ci-artifacts/weekly-media-results.json
          exit "$pytest_status"

      # Weekly artifacts are failure-only diagnostics. Raw pytest and JUnit
      # output can contain paths and traceback text, so retain only reviewed
      # projections. All retained artifacts expire quickly.
      - name: Upload slow e2e failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-e2e-${{ github.run_id }}
          path: |
            ci-artifacts/weekly-media-preflight.log
            ci-artifacts/weekly-media-results.json
            ci-artifacts/detector-lab-real-media/**
            ci-artifacts/ground-truth-failures/**
          retention-days: 7

  api-stream-deep:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,detectorlab]

      - name: Validate manifest-backed CI target groups
        run: python .github/scripts/validate_ci_test_targets.py

      - name: Run weekly_slow_real_media api_stream deep validation
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider \
            $(python3 .github/scripts/read_ci_test_targets.py weekly_api_stream_deep --separator space) \
            -q 2>&1 | tee ci-artifacts/api-stream-deep.log

      - name: Upload api_stream deep validation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-stream-deep-${{ github.run_id }}
          path: ci-artifacts/api-stream-deep.log
          retention-days: 7

  lifecycle-deep:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,detectorlab]

      - name: Validate manifest-backed CI target groups
        run: python .github/scripts/validate_ci_test_targets.py

      - name: Run weekly_slow_real_media lifecycle backend tests
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider \
            $(python3 .github/scripts/read_ci_test_targets.py weekly_lifecycle --separator space) \
            -q 2>&1 | tee ci-artifacts/lifecycle-deep.log

      - name: Upload lifecycle deep validation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-deep-${{ github.run_id }}
          path: ci-artifacts/lifecycle-deep.log
          retention-days: 7

      - name: Upload lifecycle session artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-session-artifacts-${{ github.run_id }}
          path: |
            data/sessions/**/session.json
            data/sessions/**/progress.json
            data/sessions/**/worker.log
            data/sessions/**/results.jsonl
            data/sessions/**/alerts.jsonl
          retention-days: 7

  security-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked security dependencies
        run: uv sync --locked --extra security

      - name: Run Bandit
        run: .venv/bin/bandit -r src -x tests,frontend

  python-security-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked security dependencies
        run: uv sync --locked --extra security

      - name: Run pip-audit
        run: PIP_AUDIT=.venv/bin/pip-audit sh scripts/audit_python_dependencies.sh

  npm-security-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: bash ../scripts/install_frontend_dependencies.sh

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  gitleaks-audit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install checksum-verified Gitleaks
        run: python scripts/install_security_tool.py gitleaks --bin-dir "$RUNNER_TEMP/esm-security-tools"

      - name: Scan committed repository history
        run: |
          "$RUNNER_TEMP/esm-security-tools/gitleaks" git --redact --no-banner --exit-code 1

  actionlint-audit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install checksum-verified Actionlint
        run: python scripts/install_security_tool.py actionlint --bin-dir "$RUNNER_TEMP/esm-security-tools"

      - name: Validate GitHub Actions workflows
        run: "$RUNNER_TEMP/esm-security-tools/actionlint"

  dependency-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Check dependency consistency
        run: python -m pip check

  packaging-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run editable-install packaging smoke
        run: |
          python -m venv /tmp/esm-packaging-weekly
          /tmp/esm-packaging-weekly/bin/python -m pip install --upgrade pip setuptools wheel
          /tmp/esm-packaging-weekly/bin/python -m pip install --no-deps --no-build-isolation -e .

  postgres-alert-backend-confidence:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: election_stream_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d election_stream_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install "psycopg[binary]"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d election_stream_monitor; do sleep 1; done

      - name: Run weekly live Postgres backend confidence bundle
        env:
          ESM_POSTGRES_ALERT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/election_stream_monitor
          ESM_ALERT_STORE_BACKEND: postgres
          POSTGRES_ALERT_STORE_REAL_SMOKE: "1"
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          python3 scripts/postgres_alert_weekly_backend_confidence.py 2>&1 | tee ci-artifacts/postgres-alert-backend-confidence.log

      - name: Upload live Postgres backend confidence log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-alert-backend-confidence-${{ github.run_id }}
          path: ci-artifacts/postgres-alert-backend-confidence.log
          retention-days: 7

  postgres-alert-runtime-operator-confidence:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: election_stream_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d election_stream_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install "psycopg[binary]"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d election_stream_monitor; do sleep 1; done

      - name: Run weekly live Postgres runtime/operator-flow bundle
        env:
          ESM_POSTGRES_ALERT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/election_stream_monitor
          ESM_ALERT_STORE_BACKEND: postgres
          POSTGRES_ALERT_STORE_REAL_SMOKE: "1"
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          python3 scripts/postgres_alert_weekly_runtime_operator_confidence.py 2>&1 | tee ci-artifacts/postgres-alert-runtime-operator-confidence.log

      - name: Upload live Postgres runtime/operator confidence log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-alert-runtime-operator-confidence-${{ github.run_id }}
          path: ci-artifacts/postgres-alert-runtime-operator-confidence.log
          retention-days: 7
