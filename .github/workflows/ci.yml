name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      workflow: ${{ steps.filter.outputs.workflow }}
      contract: ${{ steps.filter.outputs.contract }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'frontend/README.md'
            workflow:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - 'frontend/package.json'
              - 'pyproject.toml'
            contract:
              - 'src/source_validation.py'
              - 'src/session_io.py'
              - 'src/session_models.py'
              - 'src/alert_rules.py'
              - 'src/stream_loader_contracts.py'
              - 'src/api/routers/sessions.py'
              - 'src/api/schemas.py'
              - 'frontend/src/bridge/**'
              - 'frontend/src/types.ts'

  main-pr-consistency:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Keep the owner/consumer contract healthy before evaluating policy.
      # Protected main-PR order is:
      # 1. manifest structure/scope
      # 2. CI-owned test-path existence
      # 3. workflow/policy drift
      # 4. narrower PR gate policy
      - name: Validate CI test target manifest structure and boundary
        run: python .github/scripts/validate_ci_test_targets.py

      # Fail early on missing CI-owned test paths before broader alignment or
      # policy checks have a chance to become noisier.
      - name: Check CI-owned test path existence
        run: python .github/scripts/check_ci_test_paths_exist.py

      # Prove that the protected contract lane and the main-PR policy still
      # consume the same shared manifest groups through one explicit alignment
      # model. Weekly-only groups and the inline smoke path are intentionally
      # outside this equality rule. Workflow-side extraction now tolerates
      # light shell-formatting changes, and policy-side extraction reads from
      # the explicit owner helper in `check_main_pr_consistency.py`.
      - name: Check CI target drift and workflow-policy alignment
        run: python .github/scripts/check_ci_target_drift.py

      # Run the narrower PR policy only after the manifest and its consumers
      # are known to be aligned.
      - name: Run manifest-backed main PR gate policy
        run: python .github/scripts/check_main_pr_consistency.py origin/${{ github.base_ref }}...HEAD

  frontend-checkpoint:
    runs-on: ubuntu-24.04
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm ci

      - name: Run frontend checkpoint
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm run test:frontend-checkpoint

      - name: Skip frontend checkpoint
        if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.backend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No frontend, backend, or contract changes detected; skipping frontend checkpoint."

  backend-tests:
    runs-on: ubuntu-24.04
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run editable-install packaging check
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -m venv /tmp/esm-packaging-check
          /tmp/esm-packaging-check/bin/python -m pip install --upgrade pip setuptools wheel
          /tmp/esm-packaging-check/bin/python -m pip install --no-deps --no-build-isolation -e .

      - name: Install Python dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run packaging smoke check
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -c "import api.app, api.routers.sessions, session_service, session_cli"

      - name: Run backend tests
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          # Keep the fast backend lane synthetic and lightweight. Slow or
          # real-media suites must stay in the weekly manifest-backed lanes,
          # while shared contract ownership lives in `test-and-build`.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q -m "not e2e and not slow" 2>&1 | tee ci-artifacts/backend-tests.log

      - name: Skip backend tests
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No backend or contract changes detected; skipping backend tests."

      - name: Upload backend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.run_id }}
          path: ci-artifacts/backend-tests.log
          retention-days: 7

  backend-ruff:
    runs-on: ubuntu-24.04
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python lint dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -m pip install --upgrade pip
          pip install -e .[lint]

      - name: Run backend Ruff lint
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: ruff check src tests

      - name: Skip backend Ruff lint
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No backend or contract changes detected; skipping backend Ruff lint."

  frontend-typecheck:
    runs-on: ubuntu-24.04
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm ci

      - name: Run frontend typecheck
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm run typecheck

      - name: Skip frontend typecheck
        if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No frontend or contract changes detected; skipping frontend typecheck."

  frontend-lint:
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm run lint:frontend

      - name: Skip frontend lint
        if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No frontend or contract changes detected; skipping frontend lint."

  contract-checks:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || github.base_ref == 'main')
    needs:
      - changes
      - frontend-checkpoint
      - backend-tests
      - frontend-typecheck

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm run lint:frontend

      - name: Skip frontend lint
        if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No frontend or contract changes detected; skipping frontend lint."

  backend-typecheck:
    runs-on: ubuntu-24.04
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python typecheck dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -m pip install --upgrade pip
          pip install -e .[typecheck]

      - name: Run backend typecheck
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: MYPYPATH=src mypy --explicit-package-bases src/alert_rules.py src/api/app.py src/api/routers/alerts.py src/api/routers/detectors.py src/api/routers/health.py src/api/routers/playback.py src/api/routers/sessions.py src/api/schemas.py src/api_auth.py src/api_boundary_config.py src/api_rate_limit.py src/api_server_cli.py src/esm_mcp/alert_tools.py src/esm_mcp/server.py src/session_alert_adapter.py src/session_alert_incidents.py src/session_alerts.py src/session_io.py src/session_models.py src/session_runner.py src/session_service.py src/stream_loader_contracts.py

      - name: Skip backend typecheck
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No backend or contract changes detected; skipping backend typecheck."

  backend-pyright:
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python typecheck dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e .[typecheck]

      - name: Run backend pyright
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: .venv/bin/pyright --project pyrightconfig.json src/alert_rules.py src/api/app.py src/api/routers/alerts.py src/api/routers/detectors.py src/api/routers/health.py src/api/routers/playback.py src/api/routers/sessions.py src/api/schemas.py src/api_auth.py src/api_boundary_config.py src/api_rate_limit.py src/api_server_cli.py src/esm_mcp/alert_tools.py src/esm_mcp/server.py src/session_alert_adapter.py src/session_alert_incidents.py src/session_alerts.py src/session_io.py src/session_models.py src/session_runner.py src/session_service.py src/stream_loader_contracts.py

      - name: Skip backend pyright
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.contract != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
        run: echo "No backend or contract changes detected; skipping backend pyright."

  feature-gate:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - frontend-checkpoint
      - backend-tests
      - frontend-typecheck
      - backend-typecheck
      - backend-ruff

    steps:
      - name: Verify required feature checks
        env:
          FRONTEND_CHECKPOINT_RESULT: ${{ needs.frontend-checkpoint.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_TYPECHECK_RESULT: ${{ needs.frontend-typecheck.result }}
          BACKEND_TYPECHECK_RESULT: ${{ needs.backend-typecheck.result }}
          BACKEND_RUFF_RESULT: ${{ needs.backend-ruff.result }}
        run: |
          set -eu
          for check in \
            "frontend-checkpoint:${FRONTEND_CHECKPOINT_RESULT}" \
            "backend-tests:${BACKEND_TESTS_RESULT}" \
            "frontend-typecheck:${FRONTEND_TYPECHECK_RESULT}" \
            "backend-typecheck:${BACKEND_TYPECHECK_RESULT}" \
            "backend-ruff:${BACKEND_RUFF_RESULT}"
          do
            name=${check%%:*}
            result=${check#*:}
            if [ "$result" != "success" ]; then
              echo "::error::Required feature check '$name' finished as '$result'"
              exit 1
          fi
          done
          echo "Feature branch gate passed."

  main-gate:
    runs-on: ubuntu-24.04
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    needs:
      - feature-gate
      - main-pr-consistency
      - integration-smoke
      - contract-checks
      - test-and-build

    steps:
      - name: Verify required main checks
        env:
          FEATURE_GATE_RESULT: ${{ needs.feature-gate.result }}
          MAIN_PR_CONSISTENCY_RESULT: ${{ needs.main-pr-consistency.result }}
          INTEGRATION_SMOKE_RESULT: ${{ needs.integration-smoke.result }}
          CONTRACT_CHECKS_RESULT: ${{ needs.contract-checks.result }}
          TEST_AND_BUILD_RESULT: ${{ needs.test-and-build.result }}
        run: |
          set -eu
          for check in \
            "feature-gate:${FEATURE_GATE_RESULT}" \
            "main-pr-consistency:${MAIN_PR_CONSISTENCY_RESULT}" \
            "integration-smoke:${INTEGRATION_SMOKE_RESULT}" \
            "contract-checks:${CONTRACT_CHECKS_RESULT}" \
            "test-and-build:${TEST_AND_BUILD_RESULT}"
          do
            name=${check%%:*}
            result=${check#*:}
            if [ "$result" != "success" ]; then
              echo "::error::Required main check '$name' finished as '$result'"
              exit 1
            fi
          done
          echo "Main branch gate passed."

  test-and-build:
    runs-on: ubuntu-24.04
    needs:
      - changes
      - frontend-checkpoint
      - backend-tests
      - frontend-typecheck

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.backend == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.backend == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        working-directory: frontend
        run: npm ci

      # This validator now protects both the shared selector boundary and the
      # explicit path-existence inventory/scope that the dedicated
      # `check_ci_test_paths_exist.py` guard consumes, including the inline
      # smoke-path exception and the policy-only test ownership surface.
      # Protected contract-lane order is:
      # 1. manifest structure/scope
      # 2. CI-owned test-path existence
      # 3. workflow/policy drift alignment
      # 4. broader shared contract suites
      - name: Validate manifest-backed CI target groups
        run: python .github/scripts/validate_ci_test_targets.py

      # Fail on missing CI-owned test paths before running the broader shared
      # contract suites in this protected lane.
      - name: Check CI-owned test path existence
        run: python .github/scripts/check_ci_test_paths_exist.py

      # Keep the shared contract lane aligned with the same manifest-backed
      # policy and docs ownership model before running the heavier contract
      # suites below.
      - name: Check CI target drift and workflow-policy alignment
        run: python .github/scripts/check_ci_target_drift.py

      # The canonical manifest is already complete for this workflow lane:
      # no extra ci.yml selector groups are missing for the broad shared
      # contract coverage that runs here.
      # This protected lane stays separate from the fast synthetic backend lane
      # and from the weekly slow/real-media lanes, so selector ownership is
      # concentrated in one contract-focused place.
      # This is the remaining broad pytest consumer in ci.yml. Keep its target
      # list manifest-backed so split or renamed suites do not have to be
      # maintained inline here.
      - name: Run manifest-backed backend contract checks via shared target reader
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q \
            $(python3 .github/scripts/read_ci_test_targets.py backend_contract --separator space) \
            $(python3 .github/scripts/read_ci_test_targets.py mcp_fastapi_parity --separator space)

      # Frontend contract coverage follows the same shared-target pattern.
      - name: Run manifest-backed frontend contract checks via shared target reader
        working-directory: frontend
        run: npm run test -- $(python3 ../.github/scripts/read_ci_test_targets.py frontend_contract --separator space --strip-prefix frontend/)

  docs-consistency:
    if: github.event_name == 'pull_request' && github.base_ref != 'main' && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.contract == 'true')
    runs-on: ubuntu-24.04
    needs:
      - changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The docs/workflow consistency lane uses the same manifest contract as
      # the main PR policy lane.
      # It validates the same selector boundary plus the inline/policy
      # test-path ownership contract before checking broader workflow-policy
      # drift. Order stays:
      # 1. manifest structure/scope
      # 2. CI-owned test-path existence
      # 3. workflow/policy drift
      # 4. narrower docs/workflow gate policy
      - name: Validate CI test target manifest structure and boundary
        run: python .github/scripts/validate_ci_test_targets.py

      - name: Check CI-owned test path existence
        run: python .github/scripts/check_ci_test_paths_exist.py

      - name: Check CI target drift and workflow-policy alignment
        run: python .github/scripts/check_ci_target_drift.py

      - name: Run manifest-backed docs and workflow gate policy
        run: python .github/scripts/check_main_pr_consistency.py origin/${{ github.base_ref }}...HEAD

  integration-smoke:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    needs:
      - frontend-checkpoint

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # Keep only genuinely small one-off workflow lists inline. This smoke
      # path is intentionally narrow, does not represent reusable shared CI
      # ownership, and would add more noise than value if extracted.
      - name: Run integration smoke test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q tests/test_e2e_local_session.py
